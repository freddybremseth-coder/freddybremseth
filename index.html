<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddy Bremseth</title>
  <meta name="description" content="Freddy Bremseth — Eiendomsrådgiver, Entreprenør, Musiker og Forfatter. Costa Blanca, AI, Olivenfarming.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:  #0c0b0a;
      --bg2: #131210;
      --bg3: #1c1a17;
      --gold: #c9a96e;
      --gold-lt: #e2c57d;
      --gold-dim: rgba(201,169,110,0.12);
      --gold-border: rgba(201,169,110,0.25);
      --text: #f0ead8;
      --muted: #7a6e5e;
      --muted2: #a89880;
      --r: 6px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 400; line-height: 1.6; overflow-x: hidden; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; line-height: 1.2; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    section { padding: 100px 0; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    .gold { color: var(--gold); }
    .section-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-family: 'DM Sans', sans-serif; font-weight: 500; margin-bottom: 16px; }
    .section-title { font-size: clamp(32px, 4vw, 52px); margin-bottom: 24px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(12,11,10,0.95) 0%, transparent 100%); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(201,169,110,0.08); transition: background 0.3s; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; letter-spacing: 1px; }
    .nav-logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted2); transition: color 0.2s; font-weight: 500; cursor: pointer; }
    .nav-links a:hover { color: var(--gold); }
    .lang-toggle { display: flex; gap: 4px; background: var(--bg3); border-radius: 20px; padding: 3px; border: 1px solid var(--gold-border); }
    .lang-btn { padding: 4px 12px; border-radius: 16px; font-size: 11px; letter-spacing: 1px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted2); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .lang-btn.active { background: var(--gold); color: #0c0b0a; }

    /* HERO */
    .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; position: relative; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 70% 50%, rgba(201,169,110,0.06) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 20% 80%, rgba(100,80,50,0.05) 0%, transparent 60%); }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .hero-photo-wrap { position: relative; }
    .hero-photo { width: 100%; max-width: 480px; aspect-ratio: 4/5; object-fit: cover; object-position: center top; border-radius: 4px; filter: grayscale(15%) contrast(1.05); }
    .hero-photo-frame { position: absolute; inset: -12px; border: 1px solid var(--gold-border); border-radius: 6px; pointer-events: none; }
    .hero-photo-frame::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 1px solid rgba(201,169,110,0.08); border-radius: 4px; }
    .hero-overline { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; }
    .hero-name { font-size: clamp(48px, 6vw, 80px); font-weight: 700; line-height: 1.05; margin-bottom: 8px; }
    .hero-name em { font-style: italic; color: var(--gold); }
    .hero-subtitle { font-size: 16px; color: var(--muted2); margin-bottom: 40px; line-height: 1.8; font-weight: 300; }
    .hero-roles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px; }
    .hero-role { padding: 6px 16px; border: 1px solid var(--gold-border); border-radius: 20px; font-size: 12px; letter-spacing: 1px; color: var(--gold); font-weight: 500; }
    .hero-cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px; background: var(--gold); color: #0c0b0a; border-radius: 2px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: all 0.25s; }
    .hero-cta:hover { background: var(--gold-lt); transform: translateY(-2px); }
    .hero-cta svg { transition: transform 0.25s; }
    .hero-cta:hover svg { transform: translateX(4px); }

    /* TICKER */
    .ticker-wrap { background: var(--bg2); border-top: 1px solid var(--gold-border); border-bottom: 1px solid var(--gold-border); padding: 14px 0; overflow: hidden; }
    .ticker-track { display: flex; animation: ticker 28s linear infinite; white-space: nowrap; }
    .ticker-item { display: inline-flex; align-items: center; gap: 24px; padding: 0 40px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted2); }
    .ticker-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* ABOUT */
    .about { background: var(--bg2); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    .about-text p { color: var(--muted2); margin-bottom: 20px; font-size: 16px; line-height: 1.85; }
    .about-text p:first-of-type { font-size: 18px; color: var(--text); }
    .about-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 40px; }
    .stat { padding: 24px; border: 1px solid var(--gold-border); border-radius: var(--r); background: var(--bg3); }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--gold); margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
    .about-quote { background: var(--bg3); border: 1px solid var(--gold-border); border-radius: var(--r); padding: 20px 24px; margin-bottom: 24px; }
    .about-quote p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 15px; color: var(--text); line-height: 1.6; }
    .about-quote span { display: block; margin-top: 8px; font-size: 11px; letter-spacing: 1px; color: var(--gold); }
    .role-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: var(--r); margin-bottom: 12px; transition: border-color 0.2s; }
    .role-card:hover { border-color: var(--gold); }
    .role-icon { font-size: 22px; width: 44px; height: 44px; background: var(--gold-dim); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .role-label { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .role-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.3px; }

    /* MUSIC */
    .music { background: var(--bg); }
    .music-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .music-visual { border-radius: var(--r); overflow: hidden; border: 1px solid var(--gold-border); }
    .music-main-img { position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .music-main-img img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.6s; }
    .music-main-img .img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,11,10,0.7) 0%, transparent 50%); }
    .music-nav-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
    .music-dots { display: flex; gap: 8px; }
    .music-dot { width: 8px; height: 8px; border-radius: 50%; border: none; cursor: pointer; padding: 0; transition: background 0.2s; }
    .music-strip { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--gold-border); }
    .music-strip img { width: 100%; height: 90px; object-fit: cover; opacity: 0.7; transition: opacity 0.2s; cursor: pointer; }
    .music-strip img:hover { opacity: 1; }
    .music-strip-logo { background: var(--bg3); display: flex; align-items: center; justify-content: center; padding: 12px; height: 90px; }
    .music-strip-logo img { max-height: 50px; object-fit: contain; }
    .yt-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ff0000; color: #fff; border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }
    .bars { display: flex; gap: 4px; align-items: flex-end; height: 32px; }
    .bar { width: 4px; background: var(--gold); border-radius: 2px; animation: equalize 1.2s ease-in-out infinite; }
    .bar:nth-child(1) { animation-delay: 0s; height: 60%; }
    .bar:nth-child(2) { animation-delay: 0.15s; height: 100%; }
    .bar:nth-child(3) { animation-delay: 0.3s; height: 45%; }
    .bar:nth-child(4) { animation-delay: 0.45s; height: 80%; }
    .bar:nth-child(5) { animation-delay: 0.6s; height: 35%; }
    @keyframes equalize { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
    .music-desc h2 { font-size: 36px; margin-bottom: 16px; }
    .music-desc p { color: var(--muted2); margin-bottom: 16px; line-height: 1.8; }
    .genre-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .genre-tag { padding: 6px 14px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 20px; font-size: 12px; color: var(--gold); }
    .music-link { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; border: 1px solid var(--gold); color: var(--gold); border-radius: 2px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; transition: all 0.25s; }
    .music-link:hover { background: var(--gold); color: #0c0b0a; }

    /* BRANDS */
    .brands { background: var(--bg2); }
    .brands-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 60px; }
    .brand-card { border: 1px solid var(--gold-border); border-radius: var(--r); background: var(--bg3); transition: all 0.3s; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
    .brand-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,169,110,0.06) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .brand-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .brand-card:hover::before { opacity: 1; }
    .brand-card-body { padding: 28px 28px 24px; display: flex; flex-direction: column; flex: 1; }
    .brand-img-header { width: 100%; height: 160px; overflow: hidden; position: relative; }
    .brand-img-header img.brand-bg { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; transition: transform 0.4s; }
    .brand-card:hover .brand-img-header img.brand-bg { transform: scale(1.04); }
    .brand-img-overlay-logo { position: absolute; bottom: 12px; left: 16px; height: 36px; max-width: 140px; object-fit: contain; filter: drop-shadow(0 1px 6px rgba(0,0,0,0.8)); }
    .brand-logo-header { padding: 24px 28px; background: linear-gradient(135deg, rgba(201,169,110,0.07) 0%, rgba(28,26,23,0.95) 100%); border-bottom: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; height: 160px; }
    .brand-logo-header img { max-height: 90px; max-width: 200px; object-fit: contain; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5)); }
    .brand-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--gold-dim); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; font-size: 22px; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 6px; }
    .brand-url { font-size: 11px; letter-spacing: 1px; color: var(--gold); margin-bottom: 14px; }
    .brand-desc { font-size: 13px; color: var(--muted2); line-height: 1.7; flex: 1; }
    .brand-products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 16px; border-radius: 3px; overflow: hidden; }
    .brand-products img { width: 100%; height: 64px; object-fit: cover; opacity: 0.8; transition: opacity 0.2s; }
    .brand-products img:hover { opacity: 1; }
    .brand-arrow { margin-top: 20px; font-size: 12px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: gap 0.2s; }
    .brand-card:hover .brand-arrow { gap: 14px; }

    /* REAL ESTATE */
    .realestate { background: var(--bg); }
    .re-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .re-visual { border-radius: var(--r); overflow: hidden; border: 1px solid var(--gold-border); }
    .re-img-wrap { position: relative; }
    .re-img-wrap img { width: 100%; height: 280px; object-fit: cover; display: block; }
    .re-img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,11,10,0.85) 0%, transparent 55%); }
    .re-badge { position: absolute; top: 16px; left: 16px; background: var(--gold); color: #0c0b0a; padding: 4px 12px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .re-title-block { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 24px; }
    .re-title-block h3 { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 4px; }
    .re-title-block p { font-size: 13px; color: var(--muted2); letter-spacing: 0.5px; }
    .re-features { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg3); border-top: 1px solid var(--gold-border); }
    .re-feature { padding: 14px 0; text-align: center; border-right: 1px solid var(--gold-border); }
    .re-feature:last-child { border-right: none; }
    .re-feature-icon { font-size: 18px; margin-bottom: 4px; }
    .re-feature-val { font-size: 13px; font-weight: 600; }
    .re-feature-lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }
    .re-view-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; background: var(--gold); color: #0c0b0a; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
    .re-view-btn:hover { background: var(--gold-lt); }
    .re-content p { color: var(--muted2); margin-bottom: 16px; font-size: 16px; line-height: 1.8; }
    .re-links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
    .re-link-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border: 1px solid var(--gold-border); border-radius: var(--r); background: var(--bg3); transition: all 0.25s; }
    .re-link-card:hover { border-color: var(--gold); background: var(--bg2); }
    .re-link-icon { font-size: 20px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--bg2); border: 1px solid var(--gold-border); border-radius: 8px; flex-shrink: 0; overflow: hidden; }
    .re-link-icon img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
    .re-link-info h4 { font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 600; }
    .re-link-info p { font-size: 12px; color: var(--muted); margin: 0; }
    .re-link-arrow { margin-left: auto; color: var(--gold); font-size: 18px; }

    /* TOURS */
    .tours { background: var(--bg2); }
    .tours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 48px; }
    .tour-card { border: 1px solid var(--gold-border); border-radius: var(--r); padding: 28px 24px; background: var(--bg3); text-align: center; transition: all 0.3s; }
    .tour-card:hover { border-color: var(--gold); transform: translateY(-4px); }
    .tour-icon { font-size: 32px; margin-bottom: 16px; }
    .tour-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 8px; }
    .tour-desc { font-size: 13px; color: var(--muted2); line-height: 1.7; }
    .tours-cta { margin-top: 48px; text-align: center; }

    /* BOOKS */
    .books { background: var(--bg); }
    .books-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--gold-border); margin-bottom: 48px; overflow-x: auto; }
    .books-tab { padding: 12px 24px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-weight: 500; background: none; border-top: none; border-left: none; border-right: none; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .books-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .books-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .book-card { border: 1px solid var(--gold-border); border-radius: var(--r); padding: 20px; background: var(--bg3); display: flex; gap: 16px; align-items: flex-start; transition: all 0.25s; }
    .book-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .book-spine { width: 48px; min-width: 48px; height: 64px; border-radius: 3px; background: linear-gradient(135deg, var(--gold-dim) 0%, rgba(201,169,110,0.25) 100%); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .book-info { flex: 1; min-width: 0; }
    .book-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .book-series { font-size: 11px; color: var(--gold); letter-spacing: 0.5px; margin-bottom: 8px; }
    .book-lang { display: inline-block; padding: 2px 8px; background: var(--gold-dim); border-radius: 10px; font-size: 10px; color: var(--muted2); letter-spacing: 0.5px; }

    /* BLOG */
    .blog { background: var(--bg2); }
    .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 48px; }
    .blog-card { border: 1px solid var(--gold-border); border-radius: var(--r); overflow: hidden; background: var(--bg3); transition: all 0.3s; display: flex; flex-direction: column; }
    .blog-card:hover { border-color: var(--gold); transform: translateY(-4px); }
    .blog-img { width: 100%; height: 180px; object-fit: cover; filter: brightness(0.85); }
    .blog-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, var(--bg3) 0%, rgba(201,169,110,0.1) 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .blog-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .blog-tag { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 10px; }
    .blog-title { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
    .blog-excerpt { font-size: 13px; color: var(--muted2); line-height: 1.7; flex: 1; }
    .blog-meta { margin-top: 16px; font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

    /* CONTACT */
    .contact { background: var(--bg2); }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
    .contact-links { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; }
    .contact-link { display: flex; align-items: center; gap: 14px; color: var(--muted2); font-size: 14px; transition: color 0.2s; }
    .contact-link:hover { color: var(--gold); }
    .contact-link-icon { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .wa-link { background: rgba(37,211,102,0.08); border: 1px solid rgba(37,211,102,0.3); border-radius: var(--r); padding: 12px 16px; }
    .wa-link .contact-link-icon { background: #25D366; border: none; }
    .wa-link .wa-label { font-size: 14px; font-weight: 600; color: #4ade80; margin-bottom: 2px; }
    .contact-form { display: flex; flex-direction: column; gap: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .form-input { padding: 14px 16px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: var(--r); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--gold); }
    .form-input::placeholder { color: var(--muted); }
    textarea.form-input { min-height: 120px; resize: vertical; }
    .form-submit { padding: 14px 32px; background: var(--gold); color: #0c0b0a; border: none; border-radius: 2px; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.25s; }
    .form-submit:hover { background: var(--gold-lt); }
    .form-success { text-align: center; padding: 40px 32px; color: var(--gold); font-family: 'Playfair Display', serif; font-size: 20px; border: 1px solid var(--gold-border); border-radius: var(--r); }

    /* FOOTER */
