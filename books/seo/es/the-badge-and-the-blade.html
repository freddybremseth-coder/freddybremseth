<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/michael-thorne">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>The Badge and the Blade</h1><img src="/assets/covers/the-badge-and-the-blade.jpg" alt="The Badge and the Blade" width="240" loading="lazy"><p>Un policía jubilado es hallado asesinado en un antiguo edificio de entrenamiento, con su placa sobre el pecho y un cuchillo colocado entre los documentos a su alrededor. Las pruebas son reales, pero la forma en que están dispuestas crea una conclusión que quizá nunca pueda demostrarse. Pronto periodistas, policía y público se convierten en participantes involuntarios de un sistema que deja juzgar a la gente antes de que llegue la corrección. La propia Elena termina convertida en un objetivo. The Badge and the Blade es un thriller sobre el poder policial, verdades manipuladas y la incómoda idea de que cada hecho individual puede ser correcto aunque la historia que forman sea falsa.</p><p><a href="/es/series/michael-thorne">Explorar la serie</a></p></article></main></noscript>
