  <noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver todo el catálogo de libros</a> · <a href="/es/series/michael-thorne">La serie Michael Thorne</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Shadows of the Past</h1><img src="/assets/covers/shadows-of-the-past.jpg" alt="Shadows of the Past" width="240" loading="lazy"><p>A una mujer que ha vivido con el mismo nombre durante 37 años le comunican de repente que su identidad está bajo revisión, y poco después desaparece. Elena Martinez sigue el rastro hasta un sistema donde las identidades pueden eliminarse, sustituirse y sobrevivir a las personas a las que pertenecían. Al mismo tiempo, salen a la luz nuevas facetas de la propia historia de Michael Thorne y las diecisiete identidades robadas ligadas a su pasado. La novela combina un misterio de persona desaparecida, una conspiración institucional y suspense psicológico. El resultado es una historia sobre lo que ocurre cuando el registro oficial insiste en que eres alguien distinto de quien sabes que eres.</p><p><a href="/es/series/michael-thorne">La serie Michael Thorne</a></p></article></main></noscript>
