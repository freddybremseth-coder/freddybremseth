<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/elias-holm">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Rommet med knoklene</h1><img src="/assets/covers/rommet-med-knoklene.jpg" alt="Rommet med knoklene" width="240" loading="lazy"><p>El hallazgo de restos humanos obliga a Elias Holm a una investigación en la que nombres, cuerpos y registros ya no coinciden. Un brazalete, mensajes antiguos, muertes que no existen y documentos de Havvik arrastran el caso al misterio de identidad más amplio de la serie. Varias personas pueden estar vinculadas al mismo nombre, mientras que algunos de los muertos registrados parecen haber seguido existiendo en el sistema. Elias debe separar lo que los laboratorios pueden demostrar realmente de las historias que los documentos intentan contar. La habitación de los huesos es una novela negra oscura sobre la forma más básica de identidad: a quién pertenece realmente un cuerpo.</p><p><a href="/es/series/elias-holm">Explorar la serie</a></p></article></main></noscript>
