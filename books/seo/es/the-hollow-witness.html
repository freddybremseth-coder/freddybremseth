<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/michael-thorne">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>The Hollow Witness</h1><img src="/assets/covers/the-hollow-witness.jpg" alt="The Hollow Witness" width="240" loading="lazy"><p>Una testigo dijo la verdad, pero faltan 21 minutos en la transcripción oficial. Años después, las personas que saben qué se eliminó empiezan a morir, y Elena Martinez sigue el rastro a través de audiencias selladas, grabaciones antiguas y documentos manipulados. En el centro del caso está Tessa Ward, una mujer que se niega a que su propia supervivencia se use como prueba de que Michael Thorne mostró clemencia. La novela explora cómo un sistema puede dejar existir las palabras de una testigo mientras elimina todo lo que las confirma. The Hollow Witness es un thriller oscuro sobre testimonios, poder institucional y la verdad que desaparece entre dos versiones del mismo documento.</p><p><a href="/es/series/michael-thorne">Explorar la serie</a></p></article></main></noscript>
