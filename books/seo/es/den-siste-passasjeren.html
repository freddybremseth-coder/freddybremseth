<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/elias-holm">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Den siste passasjeren</h1><img src="/assets/covers/den-siste-passasjeren.jpg" alt="Den siste passasjeren" width="240" loading="lazy"><p>Laia Rius tiene un billete válido y pasa el control, pero segundos después recibe un mensaje: está registrada como «transfer». Un viaje aparentemente normal abre un rastro internacional de billetes protegidos, ADN que no coincide, identidades ocultas y personas trasladadas entre jurisdicciones. Elias Holm debe seguir un sistema en el que algunos pasajeros no solo viajan de un lugar a otro, sino que también abandonan una identidad y entran en otra. Pero no todas las transiciones son voluntarias. El último pasajero es un thriller internacional sobre los límites entre protección, transporte, consentimiento y control.</p><p><a href="/es/series/elias-holm">Explorar la serie</a></p></article></main></noscript>
