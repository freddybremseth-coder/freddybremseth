<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/power-behind-curtain">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Mistankens maskin</h1><img src="/assets/covers/mistankens-maskin.png" alt="Mistankens maskin" width="240" loading="lazy"><p>¿Por qué se arraigan tan fuerte algunas teorías que incluso las pruebas en contra se interpretan como más evidencia? Mistankens maskin (La máquina de la sospecha) examina teorías conspirativas, conspiraciones documentadas, propaganda, granjas de troles, algoritmos y la necesidad humana de encontrar patrones en el caos. Desde el JFK y la pandemia hasta la influencia política y las redes sociales modernas, se analizan tanto la sospecha razonable como las afirmaciones que van mucho más allá de las pruebas. El libro defiende el derecho a hacer preguntas difíciles, pero exige que las conclusiones se detengan donde se detiene la documentación. El resultado es una guía para ser escéptico sin perder de vista la realidad.</p><p><a href="/es/series/power-behind-curtain">Explorar la serie</a></p></article></main></noscript>
