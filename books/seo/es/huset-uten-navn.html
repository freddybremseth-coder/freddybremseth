<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/elias-holm">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Huset uten navn</h1><img src="/assets/covers/huset-uten-navn.jpg" alt="Huset uten navn" width="240" loading="lazy"><p>Luc Van Acker murió en Bélgica en 2014, pero tres años después compró una casa cerca de Dénia a su propio nombre. Dentro de la casa, Elias Holm encuentra un sistema de habitaciones, identidades temporales y personas que han adoptado nuevos nombres para escapar de vidas antiguas. Lo que empezó como protección para personas vulnerables se ha convertido gradualmente en algo más comercial y mucho más peligroso. Cuando un antiguo residente que descubrió cómo se usaban los nombres es hallado muerto, todo el caso cambia. La casa sin nombre es un thriller sobre lo que ocurre cuando la identidad pasa de ser un rescate a convertirse en una mercancía.</p><p><a href="/es/series/elias-holm">Explorar la serie</a></p></article></main></noscript>
