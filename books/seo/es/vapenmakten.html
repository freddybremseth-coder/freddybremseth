<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/power-behind-curtain">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Våpenmakten</h1><img src="/assets/covers/vapenmakten.png" alt="Våpenmakten" width="240" loading="lazy"><p>Las empresas, los mercenarios y el dinero detrás del rearme mundial. El libro 1 seguía el dinero. El libro 2 seguía la información. El poder de las armas sigue las armas mismas, y el sistema que las rodea: los fabricantes, los estados, los inversores, los intermediarios, los actores militares privados y las empresas tecnológicas que cada vez forman más parte de la guerra moderna.

La pregunta central del libro no es si las necesidades de seguridad son reales o si la industria gana dinero. Examina cómo ambas cosas pueden ser ciertas a la vez, y dónde está el límite entre lo que una sociedad realmente necesita para protegerse y lo que un sistema comercial tiene interés en vender como necesario.

El libro se estructura en cinco partes a lo largo de 17 capítulos: la máquina de guerra detrás de los conglomerados y los mercados de exportación, la economía de los mercenarios desde Executive Outcomes hasta Wagner, el dinero y la política de Noruega, Arabia Saudí y el nuevo rearme europeo, las armas del futuro con drones e inteligencia artificial, y finalmente el conjunto puesto a prueba.</p><p><a href="/es/series/power-behind-curtain">Explorar la serie</a></p></article></main></noscript>
