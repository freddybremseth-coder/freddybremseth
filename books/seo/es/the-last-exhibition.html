<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/michael-thorne">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>The Last Exhibition</h1><img src="/assets/covers/the-last-exhibition.jpg" alt="The Last Exhibition" width="240" loading="lazy"><p>Las pruebas de la historia de Michael Thorne están finalmente por organizarse y hacerse públicas sin destruir a las personas presentes en el material. Entonces asesinan a la persona responsable de la privacidad, el sistema queda comprometido y la información protegida comienza a abrirse contra la voluntad de las víctimas. Michael sigue teniendo una llave que puede abrir o destruir todo el archivo. El desenlace no trata solo de qué tiene derecho a saber el público, sino de quién es dueño de la historia de una persona. The Last Exhibition cierra la serie Michael Thorne con la pregunta hacia la que ha avanzado toda la saga: cuando se eliminan todas las explicaciones, ¿quién asume la responsabilidad en su propio nombre?</p><p><a href="/es/series/michael-thorne">Explorar la serie</a></p></article></main></noscript>
