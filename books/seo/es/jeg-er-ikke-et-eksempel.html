<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/balanced-life">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Jeg er ikke et eksempel</h1><img src="/assets/covers/jeg-er-ikke-et-eksempel.jpg" alt="Jeg er ikke et eksempel" width="240" loading="lazy"><p>Este no es un libro escrito por un médico que te dice cómo vivir. Sigue el intento de un paciente por entender qué puede decir realmente la investigación sobre condición física, fuerza, presión arterial, salud metabólica, sueño, alimentación, alcohol, cribados, medicación y envejecimiento. Las experiencias personales se usan como punto de partida para las preguntas, no como prueba de que una sola solución sirve para todos. El libro distingue entre investigación, guías clínicas, ideas plausibles y afirmaciones que van más allá de la evidencia. El objetivo es dejar al lector mejor preparado para hacer buenas preguntas sobre su propia salud, no sustituir el criterio médico.</p><p><a href="/es/series/balanced-life">Explorar la serie</a></p></article></main></noscript>
