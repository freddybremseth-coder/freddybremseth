<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/elias-holm">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>De døde signerer ikke</h1><img src="/assets/covers/de-dode-signerer-ikke.jpg" alt="De døde signerer ikke" width="240" loading="lazy"><p>Gabriel Ferrer Solano lleva cuatro años muerto cuando se firma un documento en su nombre. La firma abre una investigación sobre poderes notariales que sobreviven a sus titulares, propiedades que siguen cambiando de manos y estructuras legales en las que el muerto todavía puede influir en los vivos. Elias descubre rápidamente que el caso no trata de una sola firma falsificada, sino de un sistema mucho más amplio que ha aprendido a usar identidades de personas muertas como herramienta. Familias, herederos y personas que creían que el pasado estaba cerrado se ven arrastradas al caso. Los muertos no firman es un thriller sobre la incómoda distancia entre la muerte biológica y la existencia legal.</p><p><a href="/es/series/elias-holm">Explorar la serie</a></p></article></main></noscript>
