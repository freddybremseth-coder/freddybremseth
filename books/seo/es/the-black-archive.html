<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/michael-thorne">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>The Black Archive</h1><img src="/assets/covers/the-black-archive.jpg" alt="The Black Archive" width="240" loading="lazy"><p>Detrás de un muro en un edificio a punto de ser derribado se descubre un archivo oculto, lleno de pruebas originales de casos que se suponía estaban cerrados. Antes de que las autoridades controlen la sala, han desaparecido tres cajas numeradas. La investigación revela que el archivo no solo almacenaba información: controlaba qué parte de la verdad veía primero cada persona. Parte del material señala a Michael como víctima, otra parte como culpable, y todo parece genuino. The Black Archive es un thriller sobre pruebas, memoria y el aterrador poder de controlar el orden de la verdad.</p><p><a href="/es/series/michael-thorne">Explorar la serie</a></p></article></main></noscript>
