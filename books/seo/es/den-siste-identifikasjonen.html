<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/es/library">Ver el catálogo</a> · <a href="/es/series/elias-holm">Explorar la serie</a> · <a href="/es/about">Sobre el autor</a></nav><article><h1>Den siste identifikasjonen</h1><img src="/assets/covers/den-siste-identifikasjonen.jpg" alt="Den siste identifikasjonen" width="240" loading="lazy"><p>Dos familias llegan a recoger la misma urna, y ambas tienen papeles válidos. Lo que al principio parece un error administrativo crece hasta convertirse en una red de números de cremación, restos, identificaciones contradictorias y familias que ya habían enterrado la historia que las autoridades ahora les piden reabrir. Elias Holm debe afrontar un último dilema: algunas verdades pueden encontrarse, pero eso no significa automáticamente que todos las quieran. Después de ocho libros, los grandes temas de la serie sobre cuerpos, nombres, identidad legal y el derecho a saber convergen. La última identificación cierra la serie con la pregunta que ha acompañado a Elias todo el camino: cuando se acaban las pruebas, ¿quién tiene derecho a rellenar el resto?</p><p><a href="/es/series/elias-holm">Explorar la serie</a></p></article></main></noscript>
