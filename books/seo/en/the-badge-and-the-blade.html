<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/en/library">Explore the catalogue</a> · <a href="/en/series/michael-thorne">Explore the series</a> · <a href="/en/about">About the author</a></nav><article><h1>The Badge and the Blade</h1><img src="/assets/covers/the-badge-and-the-blade.jpg" alt="The Badge and the Blade" width="240" loading="lazy"><p>A retired police officer is found murdered in an old training building, his badge placed on his chest and a knife set among the documents around him. The evidence is real, but the way it has been arranged creates a conclusion that may never be provable. Soon journalists, police and the public become unwilling participants in a system that lets people judge before the correction arrives. Elena herself is eventually drawn in as a target. The Badge and the Blade is a thriller about police power, manipulated truths and the uncomfortable insight that every single fact can be correct even when the story they build is wrong.</p><p><a href="/en/series/michael-thorne">Explore the series</a></p></article></main></noscript>
