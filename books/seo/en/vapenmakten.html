<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/en/library">Explore the catalogue</a> · <a href="/en/series/power-behind-curtain">Explore the series</a> · <a href="/en/about">About the author</a></nav><article><h1>Våpenmakten</h1><img src="/assets/covers/vapenmakten.png" alt="Våpenmakten" width="240" loading="lazy"><p>The companies, the mercenaries and the money behind the world&#39;s rearmament. Book 1 followed the money. Book 2 followed the information. Weapons of Power follows the weapons themselves - and the system around them: the manufacturers, the states, the investors, the middlemen, private military actors and the technology companies increasingly becoming part of modern warfare.

The book&#39;s central question isn&#39;t whether security needs are real or whether the industry makes money. It examines how both can be true at once, and where the line falls between what a society actually needs to protect itself and what a commercial system has an interest in selling as necessary.

The book is built in five parts across 17 chapters: the war machine behind the conglomerates and export markets, the economics of mercenaries from Executive Outcomes to Wagner, the money and politics of Norway, Saudi Arabia and Europe&#39;s new rearmament, the weapons of the future including drones and artificial intelligence, and finally the whole picture put to the test.</p><p><a href="/en/series/power-behind-curtain">Explore the series</a></p></article></main></noscript>
