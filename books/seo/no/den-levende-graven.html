<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Den levende graven</h1><img src="/assets/covers/den-levende-graven.jpg" alt="Den levende graven" width="240" loading="lazy"><p>Tomás Vidal Cervera er i live når han står foran en kiste med sitt eget navn på lokket. Avtalen var at hans gamle identitet skulle «stenges», ikke at noen skulle begraves som ham. For Elias Holm blir kisten inngangen til et system av tomme begravelser, skjulte identiteter, mennesker som vil forsvinne og andre som har utnyttet ønsket deres. Snart blir spørsmålet ikke bare hvem som ligger i gravene, men hvem som egentlig skulle ha vært der. Den levende graven er en mørk thriller om retten til å forsvinne – og om systemene som kan gjøre et menneskes frivillige forsvinning til en forbrytelse mot noen andre.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
