<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/power-behind-curtain">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Mistankens maskin</h1><img src="/assets/covers/mistankens-maskin.png" alt="Mistankens maskin" width="240" loading="lazy"><p>Hvorfor fester enkelte teorier seg så sterkt at selv motbevis blir tolket som ytterligere bevis? Mistankens maskin undersøker konspirasjonsteorier, dokumenterte konspirasjoner, propaganda, trollfabrikker, algoritmer og menneskets behov for å finne mønster i kaos. Fra JFK og pandemien til politisk påvirkning og moderne sosiale medier analyseres både rimelig mistanke og påstander som går langt utover bevisene. Boken forsvarer retten til å stille vanskelige spørsmål, men krever samtidig at konklusjonene stopper der dokumentasjonen stopper. Resultatet er en guide til å være skeptisk uten å miste virkeligheten av syne.</p><p><a href="/series/power-behind-curtain">Om bokserien</a></p></article></main></noscript>
