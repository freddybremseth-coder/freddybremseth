<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Navnene vi begravde</h1><img src="/assets/covers/navnene-vi-begravde.jpg" alt="Navnene vi begravde" width="240" loading="lazy"><p>Elias Holm vender tilbake til Havvik når et nytt funn knytter uidentifiserte levninger til gamle laboratorier, lagrede prøver og beslutninger noen trodde var ferdig behandlet. To laboratorier kan se på det samme materialet og likevel føre etterforskningen mot forskjellige mennesker. Gamle signaturer, kalde arkiver og navn som aldri skulle åpnes igjen tvinger Elias til å konfrontere også sin egen rolle i fortiden. Jo mer teamet avdekker, desto tydeligere blir det at «fullført» ikke nødvendigvis betyr «bevist». Navnene vi begravde er en thriller om feil identifikasjon, skyld og konsekvensene av å gi en familie sikkerhet før vitenskapen egentlig har gitt oss et svar.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
