<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/michael-thorne">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>The Black Archive</h1><img src="/assets/covers/the-black-archive.jpg" alt="The Black Archive" width="240" loading="lazy"><p>Bak en vegg i en bygning som skal rives oppdages et skjult arkiv fylt med originale bevis fra saker som skulle vært avsluttet. Før myndighetene får kontroll over rommet, er tre svarte bokser borte. Etterforskningen viser at arkivet ikke bare har lagret informasjon – det har kontrollert hvilken del av sannheten ulike mennesker får se først. Noe av materialet peker mot Michael som offer, annet som gjerningsmann, og alt er tilsynelatende ekte. The Black Archive er en thriller om bevis, hukommelse og den skremmende makten som ligger i å kontrollere rekkefølgen på sannheten.</p><p><a href="/series/michael-thorne">Om bokserien</a></p></article></main></noscript>
