<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Den siste passasjeren</h1><img src="/assets/covers/den-siste-passasjeren.jpg" alt="Den siste passasjeren" width="240" loading="lazy"><p>Laia Rius har en gyldig billett og passerer kontrollen, men noen sekunder senere får hun en melding: Hun er registrert som «transfer». En tilsynelatende vanlig reise åpner et internasjonalt spor av beskyttede billetter, DNA som ikke stemmer, skjulte identiteter og mennesker som flyttes mellom jurisdiksjoner. Elias Holm må følge et system der enkelte passasjerer ikke bare reiser fra ett sted til et annet – de forlater også én identitet og går inn i en ny. Men noen av overgangene er ikke frivillige. Den siste passasjeren er en internasjonal thriller om grensene mellom beskyttelse, transport, samtykke og kontroll.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
