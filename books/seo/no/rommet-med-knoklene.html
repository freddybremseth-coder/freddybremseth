<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Rommet med knoklene</h1><img src="/assets/covers/rommet-med-knoklene.jpg" alt="Rommet med knoklene" width="240" loading="lazy"><p>Funnet av menneskelige levninger tvinger Elias Holm inn i en etterforskning der navn, kropper og registre ikke lenger passer sammen. Et armbånd, gamle meldinger, dødsfall som ikke finnes og dokumenter fra Havvik trekker saken inn i seriens større identitetsmysterium. Flere mennesker kan være knyttet til det samme navnet, mens noen av de registrerte døde ser ut til å ha fortsatt å eksistere i systemet. Elias må skille mellom det laboratoriene faktisk kan bevise og historiene dokumentene forsøker å fortelle. Rommet med knoklene er en mørk krim om den mest grunnleggende formen for identitet: hvem kroppen faktisk tilhører.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
