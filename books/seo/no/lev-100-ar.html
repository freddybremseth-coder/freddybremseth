<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/mediterraneo-vital">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Lev til du er 100 år</h1><p>Hvorfor lever enkelte mennesker lenge med god funksjon og livskvalitet, mens andre får mange sykdomsår mot slutten av livet? Boken undersøker middelhavslivets mulige bidrag gjennom mat, bevegelse, sosial tilhørighet, søvn, stress, natur og hverdagsvaner. Den leter ikke etter én mirakelkur, men etter mønstre som forskning og observasjon peker mot over tid. Lang levetid behandles som mer enn antall år – målet er et liv som fortsatt har innhold og funksjon. En bok for lesere som ønsker et bredere perspektiv på helse, aldring og hva et godt langt liv egentlig betyr.</p><p><a href="/series/mediterraneo-vital">Om bokserien</a></p></article></main></noscript>
