<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Den siste identifikasjonen</h1><img src="/assets/covers/den-siste-identifikasjonen.jpg" alt="Den siste identifikasjonen" width="240" loading="lazy"><p>To familier møter opp for å hente den samme urnen – og begge har gyldige papirer. Det som først virker som en administrativ feil vokser til et nettverk av kremasjonsnumre, levninger, motstridende identifikasjoner og familier som allerede har begravd den historien myndighetene nå ber dem åpne igjen. Elias Holm må håndtere et siste dilemma: Noen sannheter kan finnes, men det betyr ikke automatisk at alle ønsker dem. Etter åtte bøker møtes seriens store temaer om kropper, navn, juridisk identitet og retten til å vite. Den siste identifikasjonen avslutter serien med spørsmålet som har fulgt Elias hele veien: Når bevisene stopper, hvem har rett til å fylle inn resten?</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
