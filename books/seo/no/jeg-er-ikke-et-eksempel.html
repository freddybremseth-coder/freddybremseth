<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/balanced-life">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Jeg er ikke et eksempel</h1><img src="/assets/covers/jeg-er-ikke-et-eksempel.jpg" alt="Jeg er ikke et eksempel" width="240" loading="lazy"><p>Dette er ikke en bok skrevet av en lege som forteller deg hvordan du skal leve. Den følger en pasients forsøk på å forstå hva forskning faktisk kan si om kondisjon, styrke, blodtrykk, metabolsk helse, søvn, kosthold, alkohol, screening, legemidler og aldring. Personlige erfaringer brukes som inngang til spørsmålene, men ikke som bevis på at én løsning passer alle. Boken skiller mellom forskning, retningslinjer, plausible ideer og påstander som går lenger enn dokumentasjonen. Målet er å gjøre leseren bedre rustet til å stille gode spørsmål om egen helse – ikke å erstatte medisinske vurderinger.</p><p><a href="/series/balanced-life">Om bokserien</a></p></article></main></noscript>
