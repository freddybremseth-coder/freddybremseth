<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Huset uten navn</h1><img src="/assets/covers/huset-uten-navn.jpg" alt="Huset uten navn" width="240" loading="lazy"><p>Luc Van Acker døde i Belgia i 2014, men tre år senere kjøpte han et hus utenfor Dénia i sitt eget navn. Inne i huset finner Elias Holm et system av rom, midlertidige identiteter og mennesker som har fått nye navn for å unnslippe gamle liv. Det som begynte som beskyttelse for utsatte mennesker har gradvis utviklet seg til noe mer kommersielt og langt farligere. Når en tidligere beboer som oppdaget hvordan navnene ble brukt blir funnet død, endres hele saken. Huset uten navn er en thriller om hva som skjer når identitet går fra å være en redning til å bli en vare.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
