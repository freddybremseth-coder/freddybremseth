<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/mediterraneo-vital">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>The Olive Oil Cure</h1><p>Olivenolje er en av grunnsteinene i middelhavskosten, men kvaliteten og innholdet kan variere dramatisk fra flaske til flaske. The Olive Oil Cure undersøker hva forskningen faktisk sier om extra virgin olive oil, fettstoffer, polyfenoler, betennelse og helse. Boken forklarer hvordan olivenolje produseres og hvorfor ferskhet, råvare og prosessering betyr så mye. Den kombinerer vitenskap med praktisk forståelse av et produkt mange bruker hver dag uten å vite særlig mye om. En bok for alle som vil forstå hvorfor god olivenolje er mer enn bare et matfett.</p><p><a href="/series/mediterraneo-vital">Om bokserien</a></p></article></main></noscript>
