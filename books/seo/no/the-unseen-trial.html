<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/michael-thorne">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>The Unseen Trial</h1><img src="/assets/covers/the-unseen-trial.jpg" alt="The Unseen Trial" width="240" loading="lazy"><p>Michael Thorne sitter endelig som tiltalt og kan ikke lenger bestemme hvilke bevis som presenteres først. Mens retten forsøker å skille mellom traumer, psykologi, påvirkning og bevisste valg, begynner en ny serie hendelser utenfor rettssalen. Noen har lært deler av Michaels metode – men påvirkning er ikke det samme som kommando. Elena må vitne, fortiden kommer inn i åpen rett, og Michael tvinges til å møte sine egne handlinger uten å skjule dem bak forklaringer. The Unseen Trial kombinerer psykologisk thriller og courtroom suspense i seriens store oppgjør med spørsmålet om personlig ansvar.</p><p><a href="/series/michael-thorne">Om bokserien</a></p></article></main></noscript>
