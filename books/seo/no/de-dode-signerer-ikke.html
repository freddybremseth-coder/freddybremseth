<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/elias-holm">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>De døde signerer ikke</h1><img src="/assets/covers/de-dode-signerer-ikke.jpg" alt="De døde signerer ikke" width="240" loading="lazy"><p>Gabriel Ferrer Solano har vært død i fire år når et dokument blir signert i hans navn. Signaturen åpner en etterforskning av fullmakter som overlever eierne, eiendommer som fortsetter å skifte hender og juridiske strukturer der den døde fortsatt kan påvirke de levende. Elias oppdager raskt at saken ikke handler om én falsk signatur, men om et langt større system som har lært å bruke døde identiteter som verktøy. Familier, arvinger og mennesker som trodde fortiden var avsluttet blir trukket inn. De døde signerer ikke er en thriller om den ubehagelige avstanden mellom biologisk død og juridisk eksistens.</p><p><a href="/series/elias-holm">Om bokserien</a></p></article></main></noscript>
