<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/let-me-explain">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Let me Explain you: Skatt og Staten</h1><p>Hvor kommer pengene fra, hvorfor tar staten inn skatt, og hvorfor virker økonomien ofte annerledes enn den forklares i nyhetene? Boken tar leseren inn i sammenhengen mellom penger, skatt, gjeld, inflasjon, offentlige budsjetter og økonomiske insentiver. Kompliserte mekanismer forklares i tilgjengelig språk uten å late som systemet er enkelt. Underveis undersøkes også hvem som vinner og taper på ulike økonomiske strukturer. Dette er økonomi for lesere som vil forstå mekanismene bak tallene – ikke bare lære definisjonene.</p><p><a href="/series/let-me-explain">Om bokserien</a></p></article></main></noscript>
