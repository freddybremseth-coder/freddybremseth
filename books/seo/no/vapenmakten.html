<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/power-behind-curtain">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>Våpenmakten</h1><img src="/assets/covers/vapenmakten.png" alt="Våpenmakten" width="240" loading="lazy"><p>Selskapene, leiesoldatene og pengestrømmen bak verdens opprustning. Bok 1 fulgte pengene. Bok 2 fulgte informasjonen. Våpenmakten følger våpnene - og systemet rundt dem: produsentene, statene, investorene, mellomleddene, private militæraktører og teknologiselskapene som i økende grad blir en del av moderne krigføring.

Bokens sentrale spørsmål er ikke om sikkerhetsbehov er reelle eller om industrien tjener penger. Den undersøker hvordan begge deler kan være sanne samtidig, og hvor grensen går mellom det et samfunn faktisk trenger for å beskytte seg og det et kommersielt system har interesse av å selge som nødvendig.

Boken er bygget opp i fem deler over 17 kapitler: krigsmaskinen bak konsernene og eksportmarkedet, leiesoldatenes økonomi fra Executive Outcomes til Wagner, pengene og politikken rundt Norge, Saudi-Arabia og Europas nye opprustning, fremtidens våpen med droner og kunstig intelligens, og til slutt hele bildet satt samlet på prøve.</p><p><a href="/series/power-behind-curtain">Om bokserien</a></p></article></main></noscript>
