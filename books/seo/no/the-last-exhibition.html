<noscript><main style="max-width:850px;margin:40px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.65"><nav aria-label="Book navigation"><a href="/library">Se hele bokkatalogen</a> · <a href="/series/michael-thorne">Om bokserien</a> · <a href="/about">Om forfatteren</a></nav><article><h1>The Last Exhibition</h1><img src="/assets/covers/the-last-exhibition.jpg" alt="The Last Exhibition" width="240" loading="lazy"><p>Bevisene fra Michael Thornes historie skal endelig organiseres og gjøres tilgjengelige for offentligheten uten å ødelegge menneskene som finnes i materialet. Så blir en person med ansvar for personvern drept, systemet kompromitteres og beskyttede opplysninger begynner å åpnes mot ofrenes vilje. Michael sitter fortsatt med en nøkkel som kan åpne eller ødelegge hele arkivet. Finalen handler derfor ikke bare om hva offentligheten har rett til å vite, men hvem som eier et menneskes historie. The Last Exhibition avslutter Michael Thorne-serien med det spørsmålet hele sagaen har beveget seg mot: Når alle forklaringene er fjernet, hvem tar ansvaret i sitt eget navn?</p><p><a href="/series/michael-thorne">Om bokserien</a></p></article></main></noscript>
