<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddy Bremseth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0b0a;
      --bg2: #131210;
      --bg3: #1c1a17;
      --gold: #c9a96e;
      --gold-lt: #e2c57d;
      --gold-dim: rgba(201,169,110,0.12);
      --gold-border: rgba(201,169,110,0.25);
      --text: #f0ead8;
      --muted: #7a6e5e;
      --muted2: #a89880;
      --r: 6px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 400; line-height: 1.6; overflow-x: hidden; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; line-height: 1.2; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    section { padding: 100px 0; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    .gold { color: var(--gold); }
    .section-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-family: 'DM Sans', sans-serif; font-weight: 500; margin-bottom: 16px; }
    .section-title { font-size: clamp(32px, 4vw, 52px); margin-bottom: 24px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(12,11,10,0.95) 0%, transparent 100%); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(201,169,110,0.08); transition: background 0.3s; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; letter-spacing: 1px; }
    .nav-logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted2); transition: color 0.2s; font-weight: 500; }
    .nav-links a:hover { color: var(--gold); }
    .lang-toggle { display: flex; gap: 4px; background: var(--bg3); border-radius: 20px; padding: 3px; border: 1px solid var(--gold-border); }
    .lang-btn { padding: 4px 12px; border-radius: 16px; font-size: 11px; letter-spacing: 1px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted2); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .lang-btn.active { background: var(--gold); color: #0c0b0a; }

    /* HERO */
    .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; position: relative; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 70% 50%, rgba(201,169,110,0.06) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 20% 80%, rgba(100,80,50,0.05) 0%, transparent 60%); }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .hero-photo-wrap { position: relative; }
    .hero-photo { width: 100%; max-width: 480px; aspect-ratio: 4/5; object-fit: cover; object-position: center top; border-radius: 4px; filter: grayscale(15%) contrast(1.05); }
    .hero-photo-frame { position: absolute; inset: -12px; border: 1px solid var(--gold-border); border-radius: 6px; pointer-events: none; }
    .hero-photo-frame::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 1px solid rgba(201,169,110,0.08); border-radius: 4px; }
    .hero-content { }
    .hero-overline { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; }
    .hero-name { font-size: clamp(48px, 6vw, 80px); font-weight: 700; line-height: 1.05; margin-bottom: 8px; }
    .hero-name em { font-style: italic; color: var(--gold); }
    .hero-subtitle { font-size: 16px; color: var(--muted2); margin-bottom: 40px; line-height: 1.8; font-weight: 300; }
    .hero-roles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px; }
    .hero-role { padding: 6px 16px; border: 1px solid var(--gold-border); border-radius: 20px; font-size: 12px; letter-spacing: 1px; color: var(--gold); font-weight: 500; }
    .hero-cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px; background: var(--gold); color: #0c0b0a; border-radius: 2px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: all 0.25s; }
    .hero-cta:hover { background: var(--gold-lt); transform: translateY(-2px); }
    .hero-cta svg { transition: transform 0.25s; }
    .hero-cta:hover svg { transform: translateX(4px); }

    /* TICKER */
    .ticker-wrap { background: var(--bg2); border-top: 1px solid var(--gold-border); border-bottom: 1px solid var(--gold-border); padding: 14px 0; overflow: hidden; }
    .ticker-track { display: flex; gap: 0; animation: ticker 24s linear infinite; white-space: nowrap; }
    .ticker-item { display: inline-flex; align-items: center; gap: 24px; padding: 0 40px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted2); }
    .ticker-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* ABOUT */
    .about { background: var(--bg2); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    .about-text p { color: var(--muted2); margin-bottom: 20px; font-size: 16px; line-height: 1.85; }
    .about-text p:first-of-type { font-size: 18px; color: var(--text); }
    .about-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 40px; }
    .stat { padding: 24px; border: 1px solid var(--gold-border); border-radius: var(--r); background: var(--bg3); }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--gold); margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
    .about-image { position: relative; }
    .about-photo { width: 100%; border-radius: 4px; filter: grayscale(20%); }
    .about-quote { position: absolute; bottom: -24px; right: -24px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: var(--r); padding: 20px 24px; max-width: 280px; }
    .about-quote p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--text); line-height: 1.6; }
    .about-quote span { display: block; margin-top: 8px; font-size: 11px; letter-spacing: 1px; color: var(--gold); }

    /* MUSIC */
    .music { background: var(--bg); }
    .music-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .music-player { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--gold-border); background: var(--bg3); aspect-ratio: 16/9; }
    .music-player iframe { width: 100%; height: 100%; border: none; }
    .music-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(12,11,10,0.6); cursor: pointer; transition: opacity 0.3s; }
    .music-overlay:hover { opacity: 0; }
    .play-btn { width: 64px; height: 64px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; }
    .bars { display: flex; gap: 4px; align-items: flex-end; height: 32px; }
    .bar { width: 4px; background: var(--gold); border-radius: 2px; animation: equalize 1.2s ease-in-out infinite; }
    .bar:nth-child(1) { animation-delay: 0s; height: 60%; }
    .bar:nth-child(2) { animation-delay: 0.15s; height: 100%; }
    .bar:nth-child(3) { animation-delay: 0.3s; height: 45%; }
    .bar:nth-child(4) { animation-delay: 0.45s; height: 80%; }
    .bar:nth-child(5) { animation-delay: 0.6s; height: 35%; }
    @keyframes equalize { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
    .music-desc h3 { font-size: 36px; margin-bottom: 16px; }
    .music-desc p { color: var(--muted2); margin-bottom: 16px; line-height: 1.8; }
    .music-genres { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .genre-tag { padding: 6px 14px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 20px; font-size: 12px; color: var(--gold); }
    .music-link { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; border: 1px solid var(--gold); color: var(--gold); border-radius: 2px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; transition: all 0.25s; }
    .music-link:hover { background: var(--gold); color: #0c0b0a; }

    /* BRANDS */
    .brands { background: var(--bg2); }
    .brands-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 60px; }
    .brand-card { border: 1px solid var(--gold-border); border-radius: var(--r); padding: 36px 32px; background: var(--bg3); transition: all 0.3s; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
    .brand-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,169,110,0.06) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; }
    .brand-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .brand-card:hover::before { opacity: 1; }
    .brand-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--gold-dim); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; font-size: 22px; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 8px; }
    .brand-url { font-size: 11px; letter-spacing: 1px; color: var(--gold); margin-bottom: 16px; }
    .brand-desc { font-size: 14px; color: var(--muted2); line-height: 1.7; flex: 1; }
    .brand-arrow { margin-top: 24px; font-size: 12px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; font-weight: 600; transition: gap 0.2s; display: flex; align-items: center; gap: 8px; }
    .brand-card:hover .brand-arrow { gap: 14px; }

    /* REAL ESTATE */
    .realestate { background: var(--bg); }
    .re-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .re-visual { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--gold-border); }
    .re-map { width: 100%; height: 400px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-family: monospace; color: var(--muted); font-size: 13px; position: relative; overflow: hidden; }
    .re-map-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,169,110,0.04) 0%, transparent 70%); }
    .re-dots { position: absolute; inset: 0; }
    .re-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.7; } }
    .re-content p { color: var(--muted2); margin-bottom: 16px; font-size: 16px; line-height: 1.8; }
    .re-links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
    .re-link-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border: 1px solid var(--gold-border); border-radius: var(--r); background: var(--bg3); transition: all 0.25s; }
    .re-link-card:hover { border-color: var(--gold); background: var(--bg2); }
    .re-link-icon { font-size: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--gold-dim); border-radius: 8px; }
    .re-link-info h4 { font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 600; }
    .re-link-info p { font-size: 12px; color: var(--muted); margin: 0; }
    .re-link-arrow { margin-left: auto; color: var(--gold); }

    /* TOURS */
    .tours { background: var(--bg2); }
    .tours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 48px; }
    .tour-card { border: 1px solid var(--gold-border); border-radius: var(--r); padding: 28px 24px; background: var(--bg3); text-align: center; transition: all 0.3s; }
    .tour-card:hover { border-color: var(--gold); transform: translateY(-4px); }
    .tour-icon { font-size: 32px; margin-bottom: 16px; }
    .tour-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 8px; }
    .tour-desc { font-size: 13px; color: var(--muted2); line-height: 1.7; }
    .tours-cta { margin-top: 48px; text-align: center; }

    /* BOOKS */
    .books { background: var(--bg); }
    .books-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--gold-border); margin-bottom: 48px; }
    .books-tab { padding: 12px 24px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-weight: 500; background: none; border-top: none; border-left: none; border-right: none; font-family: 'DM Sans', sans-serif; }
    .books-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .books-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .book-card { border: 1px solid var(--gold-border); border-radius: var(--r); padding: 24px; background: var(--bg3); display: flex; gap: 16px; align-items: flex-start; transition: all 0.25s; }
    .book-card:hover { border-color: var(--gold); }
    .book-spine { width: 48px; min-width: 48px; height: 64px; border-radius: 3px; background: linear-gradient(135deg, var(--gold-dim) 0%, rgba(201,169,110,0.25) 100%); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .book-info { flex: 1; }
    .book-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .book-series { font-size: 11px; color: var(--gold); letter-spacing: 0.5px; margin-bottom: 8px; }
    .book-lang { display: inline-block; padding: 2px 8px; background: var(--gold-dim); border-radius: 10px; font-size: 10px; color: var(--muted2); letter-spacing: 0.5px; }
    .books-amazon-cta { margin-top: 48px; text-align: center; }

    /* CONTACT */
    .contact { background: var(--bg2); }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
    .contact-info h2 { font-size: 48px; margin-bottom: 24px; }
    .contact-info p { color: var(--muted2); font-size: 16px; line-height: 1.8; margin-bottom: 32px; }
    .contact-links { display: flex; flex-direction: column; gap: 16px; }
    .contact-link { display: flex; align-items: center; gap: 14px; color: var(--muted2); font-size: 14px; transition: color 0.2s; }
    .contact-link:hover { color: var(--gold); }
    .contact-link-icon { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .contact-form { display: flex; flex-direction: column; gap: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .form-input { padding: 14px 16px; background: var(--bg3); border: 1px solid var(--gold-border); border-radius: var(--r); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--gold); }
    .form-input::placeholder { color: var(--muted); }
    textarea.form-input { min-height: 120px; resize: vertical; }
    .form-submit { padding: 14px 32px; background: var(--gold); color: #0c0b0a; border: none; border-radius: 2px; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.25s; }
    .form-submit:hover { background: var(--gold-lt); }
    .form-success { text-align: center; padding: 32px; color: var(--gold); font-family: 'Playfair Display', serif; font-size: 18px; }

    /* FOOTER */
    footer { background: var(--bg); border-top: 1px solid var(--gold-border); padding: 48px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 18px; }
    .footer-logo span { color: var(--gold); }
    .footer-links { display: flex; gap: 32px; }
    .footer-links a { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
    .footer-links a:hover { color: var(--gold); }
    .footer-copy { font-size: 12px; color: var(--muted); }

    /* TWEAKS */
    .tweaks-panel { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: var(--bg2); border: 1px solid var(--gold-border); border-radius: 10px; padding: 20px; width: 240px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: none; }
    .tweaks-panel.visible { display: block; }
    .tweaks-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 16px; }
    .tweak-row { margin-bottom: 16px; }
    .tweak-label { font-size: 11px; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0.5px; }
    .tweak-options { display: flex; gap: 6px; flex-wrap: wrap; }
    .tweak-opt { padding: 5px 12px; border: 1px solid var(--gold-border); border-radius: 14px; font-size: 11px; cursor: pointer; color: var(--muted2); background: var(--bg3); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .tweak-opt.selected { background: var(--gold); color: #0c0b0a; border-color: var(--gold); font-weight: 600; }

    /* BLOG */
    .blog { background: var(--bg2); }
    .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 48px; }
    .blog-card { border: 1px solid var(--gold-border); border-radius: var(--r); overflow: hidden; background: var(--bg3); transition: all 0.3s; display: flex; flex-direction: column; }
    .blog-card:hover { border-color: var(--gold); transform: translateY(-4px); }
    .blog-img { width: 100%; height: 180px; object-fit: cover; filter: brightness(0.85); }
    .blog-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, var(--bg3) 0%, rgba(201,169,110,0.1) 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .blog-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .blog-tag { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 10px; }
    .blog-title { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
    .blog-excerpt { font-size: 13px; color: var(--muted2); line-height: 1.7; flex: 1; }
    .blog-meta { margin-top: 16px; font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

    /* WHATSAPP */
    .wa-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; background: #25D366; color: #fff; border-radius: var(--r); font-size: 14px; font-weight: 600; transition: all 0.25s; }
    .wa-btn:hover { background: #1da851; transform: translateY(-2px); }
    .wa-icon { width: 20px; height: 20px; }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .hero-grid { grid-template-columns: 1fr; gap: 40px; }
      .hero-photo { max-width: 320px; margin: 0 auto; }
      .hero-photo-wrap { text-align: center; }
      .about-grid, .re-grid, .contact-grid, .music-inner { grid-template-columns: 1fr; gap: 40px; }
      .about-quote { position: static; margin-top: 20px; max-width: 100%; }
      .brands-grid { grid-template-columns: 1fr 1fr; }
      .tours-grid { grid-template-columns: 1fr 1fr; }
      .books-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; gap: 24px; text-align: center; }
      section { padding: 60px 0; }
    }
    @media (max-width: 600px) {
      .brands-grid { grid-template-columns: 1fr; }
      .tours-grid { grid-template-columns: 1fr; }
      .about-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "gold",
  "font": "classic",
  "heroStyle": "photo"
}/*EDITMODE-END*/;

const T = {
  no: {
    nav: ['Om meg','Musikk','Merkevarer','Eiendom','Turer','Bøker','Kontakt'],

    };
    window.addEventListener('message', handler);

    return () => window.removeEventListener('message', handler);
  }, []);

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M23.5 6.2s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.6 2 12 2 12 2s-4.6 0-7.3.1c-.6.1-1.9.1-3 1.3C.8 4.2.5 6.2.5 6.2S.2 8.5.2 10.8v2.1c0 2.3.3 4.6.3 4.6s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.2 21.7 12 21.8 12 21.8s4.6 0 7.3-.2c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.3.3-4.6v-2.1C23.8 8.5 23.5 6.2 23.5 6.2zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg>

                <div style={{background:'var(--bg3)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,padding:16}}>
                  <img src="uploads/Gemini_Generated_Image_9rr3k69rr3k69rr3 (1).png" alt="Re-Master Freddy Logo" style={{height:50,objectFit:'contain'}}/>

            </div>
            <div className="music-desc">
              <div className="section-label">{t.musicLabel}</div>
              <h2 className="section-title" style={{fontSize:36}}>{t.musicTitle}</h2>
              <p>{t.musicP1}</p>
              <p>{t.musicP2}</p>
              <div className="music-genres">
                {t.musicGenres.map(g => <span key={g} className="genre-tag">{g}</span>)}
              </div>
              <div style={{display:'flex',gap:16,alignItems:'center',marginTop:8}}>
                <div className="bars">
                  {[1,2,3,4,5].map(i=><div key={i} className="bar"/>)}
                </div>
                <a href="https://www.youtube.com/@remaster-freddy" target="_blank" rel="noopener" className="music-link">
                  {t.musicBtn} ↗
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* BRANDS */}
      <section id="brands" className="brands">
        <div className="container">
          <div className="section-label">{t.brandsLabel}</div>
          <h2 className="section-title">{t.brandsTitle}</h2>
          <div className="brands-grid">
            {brands.map(b => (
              <a key={b.name} href={b.href} target="_blank" rel="noopener" className="brand-card">
                {b.img
                  ? <div style={{width:'calc(100% + 64px)',height:120,margin:'-36px -32px 20px -32px',overflow:'hidden'}}><img src={b.img} alt={b.name} style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'center 40%'}}/></div>
                  : <div className="brand-icon">{b.icon}</div>}
                <div className="brand-name">{b.name}</div>
                <div className="brand-url">{b.url}</div>
                <div className="brand-desc">{lang==='no' ? b.descNo : lang==='es' ? (b.descEs || b.descEn) : b.descEn}</div>
                <div className="brand-arrow">
                  {lang==='no' ? 'Besøk siden' : lang==='es' ? 'Visitar sitio' : 'Visit site'} →
                </div>
              </a>
            ))}
          </div>
        </div>
      </section>

      {/* REAL ESTATE */}
      <section id="realestate" className="realestate">
        <div className="container">
          <div className="re-grid">
            <div className="re-visual" style={{borderRadius:'var(--r)',overflow:'hidden',border:'1px solid var(--gold-border)'}}>

                <div style={{position:'absolute',top:16,left:16,background:'var(--gold)',color:'#0c0b0a',padding:'4px 12px',borderRadius:2,fontSize:11,fontWeight:700,letterSpacing:2,textTransform:'uppercase'}}>
                  {lang==='no' ? 'Til salgs' : lang==='es' ? 'En venta' : 'For Sale'}
                </div>
                <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'20px 24px'}}>
                  <div style={{fontFamily:'Playfair Display,serif',fontSize:20,marginBottom:4}}>Villa med havutsikt · Costa Blanca</div>
                  <div style={{fontSize:13,color:'var(--muted2)',letterSpacing:0.5}}>Alicante · Spania</div>
                </div>
              </div>

                  {icon:'🛏', v:'4', labelNo:'Soverom', labelEn:'Bedrooms'},
                  {icon:'🏊', v:'1', labelNo:'Basseng', labelEn:'Pool'},
                  {icon:'🌊', v:'∞', labelNo:'Havutsikt', labelEn:'Sea View'},
                ].map(f => (
                  <div key={f.labelEn} style={{padding:'14px 0',textAlign:'center',borderRight:'1px solid var(--gold-border)'}}>
                    <div style={{fontSize:18,marginBottom:4}}>{f.icon}</div>
                    <div style={{fontSize:13,fontWeight:600}}>{f.v}</div>
                    <div style={{fontSize:11,color:'var(--muted)',letterSpacing:0.5}}>{lang==='no'?f.labelNo:f.labelEn}</div>
                  </div>
                ))}
              </div>
              <div style={{padding:'16px 24px',background:'var(--bg3)',borderTop:'1px solid var(--gold-border)'}}>
                <a href="https://zenecohomes.com/property.php?id=1708" target="_blank" rel="noopener" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px',background:'var(--gold)',color:'#0c0b0a',borderRadius:2,fontSize:13,fontWeight:700,letterSpacing:2,textTransform:'uppercase',fontFamily:"'DM Sans',sans-serif"}}>
                  {lang==='no' ? 'Se boligen →' : lang==='es' ? 'Ver propiedad →' : 'View property →'}
                </a>
              </div>
            </div>
            <div className="re-content">
              <div className="section-label">{t.reLabel}</div>
              <h2 className="section-title">{t.reTitle}</h2>
              <p>{t.reP1}</p>
              <p>{t.reP2}</p>
              <div className="re-links">
                <a href="https://soleada.no" target="_blank" rel="noopener" className="re-link-card">
                  <div className="re-link-icon">🏡</div>
                  <div className="re-link-info">
                    <h4>Soleada.no</h4>
                    <p>{lang==='no' ? 'Norske eiendomsrådgivere i Spania' : lang==='es' ? 'Asesores inmobiliarios noruegos en España' : 'Norwegian property advisors in Spain'}</p>
                  </div>
                  <div className="re-link-arrow">→</div>
                </a>
                <a href="https://zenecohomes.com" target="_blank" rel="noopener" className="re-link-card">
                  <div className="re-link-icon">🌿</div>
                  <div className="re-link-info">
                    <h4>Zeneco Homes</h4>
                    <p>{lang==='no' ? 'Bærekraftige boligprosjekter' : lang==='es' ? 'Proyectos de vivienda sostenible' : 'Sustainable housing projects'}</p>
                  </div>
                  <div className="re-link-arrow">→</div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* TOURS */}
      <section id="tours" className="tours">
        <div className="container">
          <div className="section-label">{t.toursLabel}</div>
          <h2 className="section-title">{t.toursTitle}</h2>
          <p style={{color:'var(--muted2)',fontSize:16}}>{t.toursSub}</p>
          <div className="tours-grid">
            {tours.map(tour => (
              <div key={tour.titleEn} className="tour-card">
                <div className="tour-icon">{tour.icon}</div>
                <div className="tour-title">{lang==='no' ? tour.titleNo : lang==='es' ? (tour.titleEs||tour.titleEn) : tour.titleEn}</div>
                <div className="tour-desc">{lang==='no' ? tour.descNo : lang==='es' ? (tour.descEs||tour.descEn) : tour.descEn}</div>
              </div>
            ))}
          </div>
          <div className="tours-cta">
            <a href="https://costablancatours.com" target="_blank" rel="noopener" className="hero-cta" style={{marginTop:0}}>
              {t.toursCta} →
            </a>
          </div>
        </div>
      </section>

      {/* BOOKS */}
      <section id="books" className="books">
        <div className="container">
          <div className="section-label">{t.booksLabel}</div>
          <h2 className="section-title">{t.booksTitle}</h2>
          <div className="books-tabs">
            {t.bookTabs.map((tab,i) => (
              <button key={tab} className={`books-tab ${bookTab===i?'active':''}`} onClick={()=>setBookTab(i)}>{tab}</button>
            ))}
          </div>
          <div className="books-grid">
            {filteredBooks.map(book => (
              <a key={book.title} href={book.amazon} target="_blank" rel="noopener" className="book-card">
                <div className="book-spine">{book.emoji}</div>
                <div className="book-info">
                  <div className="book-title">{book.title}</div>
                  <div className="book-series">{book.series}</div>
                  <span className="book-lang">{book.lang === 'NO' ? 'Norsk' : book.lang === 'ES' ? 'Español' : 'English'}</span>
                </div>
              </a>
            ))}
          </div>
          <div className="books-amazon-cta" style={{marginTop:48}}>
            <a href="https://www.amazon.com/s?k=Freddy+Bremseth" target="_blank" rel="noopener" className="music-link">
              {t.booksAmazon} ↗
            </a>
          </div>
        </div>
      </section>

      {/* CONTACT */}
      <section id="contact" className="contact">
        <div className="container">
          <div className="contact-grid">
            <div className="contact-info">
              <div className="section-label">{t.contactLabel}</div>
              <h2 className="section-title">{t.contactTitle}</h2>
              <p>{t.contactP}</p>
              <div className="contact-links">
                <a href="https://wa.me/4796009965" target="_blank" rel="noopener" className="contact-link" style={{background:'rgba(37,211,102,0.08)',border:'1px solid rgba(37,211,102,0.3)',borderRadius:'var(--r)',padding:'12px 16px'}}>
                  <div className="contact-link-icon" style={{background:'#25D366',border:'none',fontSize:18}}>💬</div>
                  <div><div style={{fontSize:14,fontWeight:600,color:'#4ade80',marginBottom:2}}>WhatsApp</div><div style={{fontSize:13}}>+47 960 09 965</div></div>
                </a>
                <a href="tel:+4796009965" className="contact-link">
                  <div className="contact-link-icon">📞</div>
                  +47 960 09 965
                </a>
                <a href="mailto:freddy.bremseth@gmail.com" className="contact-link">
                  <div className="contact-link-icon">✉️</div>
                  freddy.bremseth@gmail.com
                </a>
                <a href="https://www.youtube.com/@remaster-freddy" target="_blank" rel="noopener" className="contact-link">
                  <div className="contact-link-icon">▶</div>
                  YouTube: @remaster-freddy
                </a>
                <a href="https://soleada.no" target="_blank" rel="noopener" className="contact-link">
                  <div className="contact-link-icon">🏡</div>
                  soleada.no
                </a>
                <a href="https://zenecohomes.com" target="_blank" rel="noopener" className="contact-link">
                  <div className="contact-link-icon">🌿</div>
                  zenecohomes.com
                </a>
                <a href="https://chatgenius.com" target="_blank" rel="noopener" className="contact-link">
                  <div className="contact-link-icon">🤖</div>
                  chatgenius.com
                </a>
                <a href="https://donaanna.com" target="_blank" rel="noopener" className="contact-link">
                  <div className="contact-link-icon">🫒</div>
                  donaanna.com
                </a>
              </div>
            </div>
            <div>
              {formState.sent ? (
                <div className="form-success">{t.formSuccess}</div>
              ) : (
                <form className="contact-form" onSubmit={e=>{e.preventDefault();setFormState(s=>({...s,sent:true}));}}>
                  <div className="form-field">
                    <label className="form-label">{t.formName}</label>
                    <input className="form-input" value={formState.name} onChange={e=>setFormState(s=>({...s,name:e.target.value}))} required/>
                  </div>
                  <div className="form-field">
                    <label className="form-label">{t.formEmail}</label>
                    <input className="form-input" type="email" value={formState.email} onChange={e=>setFormState(s=>({...s,email:e.target.value}))} required/>
                  </div>
                  <div className="form-field">
                    <label className="form-label">{t.formMsg}</label>
                    <textarea className="form-input" value={formState.msg} onChange={e=>setFormState(s=>({...s,msg:e.target.value}))} required/>
                  </div>
                  <button type="submit" className="form-submit">{t.formSend}</button>
                </form>
              )}
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="container">
          <div className="footer-inner">
            <div className="footer-logo">Freddy <span>Bremseth</span></div>
            <div className="footer-links">
              {['zenecohomes.com','donaanna.com','chatgenius.com','soleada.no','costablancatours.com'].map(l => (
                <a key={l} href={`https://${l}`} target="_blank" rel="noopener">{l}</a>
              ))}
            </div>
            <div className="footer-copy">© 2025 Freddy Bremseth</div>
          </div>
        </div>
      </footer>

      {/* TWEAKS */}
      <div className={`tweaks-panel ${tweaksOpen ? 'visible' : ''}`}>
        <div className="tweaks-title">Tweaks</div>
        <div className="tweak-row">
          <div className="tweak-label">Aksent-farge / Accent color</div>
          <div className="tweak-options">
            {[['gold','Gold'],['silver','Silver'],['rose','Rose Gold']].map(([k,l]) => (
              <button key={k} className={`tweak-opt ${tweaks.accent===k?'selected':''}`} onClick={()=>setTweak('accent',k)}>{l}</button>
            ))}
          </div>
        </div>
        <div className="tweak-row">
          <div className="tweak-label">Booklets tab start</div>
          <div className="tweak-options">
            {['Alle / All','Mediterraneo','Balanced Life','Personal Dev'].map((k,i) => (
              <button key={k} className={`tweak-opt ${bookTab===i?'selected':''}`} onClick={()=>setBookTab(i)}>{k}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
