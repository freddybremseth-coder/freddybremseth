name: Books SEO generated-page validation
on:
  pull_request:
    paths:
      - 'books/**'
      - 'vercel.json'
      - 'scripts/test-books-root-routes.mjs'
      - '.github/workflows/books-seo-validation.yml'
  schedule:
    # Read-only build validation on the default branch; no deployment or SEO publishing.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - '.github/workflows/books-seo-validation.yml'
jobs:
  books-generated-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Root Vercel book-host canonical routing
        run: node --test scripts/test-books-root-routes.mjs
      - name: Build entire books catalogue and verify generated SEO pages
        working-directory: books
        run: npm run build
