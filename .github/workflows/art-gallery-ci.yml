name: Art gallery checks
on:
  pull_request:
    paths:
      - 'art/**'
      - '.github/workflows/art-gallery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'art/**'
      - '.github/workflows/art-gallery-ci.yml'
jobs:
  art-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test gallery
        working-directory: art
        run: npm run build
