name: Freddy Art visual duplicate audit
on:
  push:
    paths:
      - 'art/scripts/audit-gallery-images.py'
      - '.github/workflows/art-gallery-visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only image review libraries
        run: python -m pip install 'pillow>=10,<13' 'imagehash>=4.3,<5' 'numpy>=2,<3'
      - name: Review all published gallery thumbnails
        run: python art/scripts/audit-gallery-images.py
      - name: Store review report and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-visual-review
          path: art/audit-output/
          if-no-files-found: warn
